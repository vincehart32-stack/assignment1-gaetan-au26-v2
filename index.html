<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #start-menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 23, 0.72);
        backdrop-filter: blur(2px);
      }

      #start-menu.hidden {
        display: none;
      }

      .menu-card {
        max-width: 520px;
        width: calc(100% - 32px);
        background: rgba(18, 24, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 28px 24px;
        color: #f3f6fb;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      }

      .menu-card h2 {
        margin: 0 0 12px;
        font-size: 28px;
        text-align: center;
      }

      .menu-card p {
        margin: 10px 0;
        line-height: 1.6;
        font-size: 16px;
      }

      .menu-card .intro {
        font-size: 17px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 18px;
      }

      .menu-card .options {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 18px 0 8px;
        flex-wrap: wrap;
      }

      .menu-card .option-button {
        background: rgba(255, 255, 255, 0.08);
        color: #f3f6fb;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 600;
      }

      .menu-card .option-button.primary {
        background: #d8e7ff;
        color: #0f172a;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .menu-card kbd {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-family: monospace;
        font-size: 14px;
      }

      .menu-card button {
        display: block;
        margin: 18px auto 0;
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: #d8e7ff;
        color: #0f172a;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
    <script>
      // Custom A-Frame logic for the scene.
      // These components handle collisions, vertical movement, and camera-relative navigation.

      // Keeps the player inside the model's walkable surfaces and prevents wall clipping.
      AFRAME.registerComponent('mesh-collision', {
        schema: {
          target: { type: 'selector' },
          radius: { default: 0.35 }
        },
        init: function () {
          this.meshBounds = [];
          this.lastSafePosition = this.el.object3D.position.clone();
          this.onModelLoaded = this.onModelLoaded.bind(this);
          this.data.target.addEventListener('model-loaded', this.onModelLoaded);
          if (this.data.target.getObject3D('mesh')) this.onModelLoaded();
        },
        onModelLoaded: function () {
          const model = this.data.target.getObject3D('mesh');
          this.meshBounds = [];
          model.updateMatrixWorld(true);
          model.traverse(object => {
            if (!object.isMesh || !object.geometry) return;
            const bounds = new THREE.Box3().setFromObject(object);
            const size = bounds.getSize(new THREE.Vector3());
            const isEnclosingShell = size.x > 12 && size.z > 25;
            if (!isEnclosingShell) this.meshBounds.push(bounds);
          });
        },
        intersectsMesh: function (position) {
          const radius = this.data.radius;
          return this.meshBounds.some(bounds =>
            position.x + radius > bounds.min.x && position.x - radius < bounds.max.x &&
            position.y + radius > bounds.min.y && position.y - radius < bounds.max.y &&
            position.z + radius > bounds.min.z && position.z - radius < bounds.max.z
          );
        },
        tick: function () {
          const position = this.el.object3D.position;
          const previous = this.lastSafePosition;

          if (this.intersectsMesh(position)) position.x = previous.x;
          if (this.intersectsMesh(position)) position.z = previous.z;
          if (this.intersectsMesh(position)) position.y = previous.y;

          this.lastSafePosition.copy(position);
        },
        remove: function () {
          this.data.target.removeEventListener('model-loaded', this.onModelLoaded);
        }
      });

      // Vertical movement controls for up/down movement within the model bounds.
      AFRAME.registerComponent('vertical-controls', {
        schema: { speed: { default: 3 } },
        init: function () {
          this.keys = {};
          this.outerBounds = null;
          this.onKeyDown = event => {
            if (['KeyR', 'KeyF'].includes(event.code)) {
              event.preventDefault();
              this.keys[event.code] = true;
            }
          };
          this.onKeyUp = event => { this.keys[event.code] = false; };
          window.addEventListener('keydown', this.onKeyDown);
          window.addEventListener('keyup', this.onKeyUp);

          const hallway = document.getElementById('hallway');
          if (hallway) {
            hallway.addEventListener('model-loaded', () => {
              const model = hallway.getObject3D('mesh');
              if (!model) return;
              model.updateMatrixWorld(true);
              this.outerBounds = new THREE.Box3().setFromObject(model);
            });
          }
        },
        tick: function (time, delta) {
          const up = this.keys.ArrowUp || this.keys.PageUp || this.keys.KeyR;
          const down = this.keys.ShiftLeft || this.keys.ShiftRight || this.keys.ArrowDown || this.keys.PageDown || this.keys.KeyF;
          const direction = (up ? 1 : 0) - (down ? 1 : 0);
          if (!direction) return;

          const nextY = this.el.object3D.position.y + direction * this.data.speed * delta / 1000;
          if (!this.outerBounds) {
            this.el.object3D.position.y = nextY;
            return;
          }

          const radius = 0.5;
          const minY = this.outerBounds.min.y + radius;
          const maxY = this.outerBounds.max.y - radius;
          if (nextY < minY || nextY > maxY) return;

          this.el.object3D.position.y = nextY;
        },
        remove: function () {
          window.removeEventListener('keydown', this.onKeyDown);
          window.removeEventListener('keyup', this.onKeyUp);
        }
      });

      // Horizontal movement relative to the camera direction so W/A/S/D feel natural.
      AFRAME.registerComponent('camera-relative-controls', {
        schema: { speed: { default: 3.2 } },
        init: function () {
          this.keys = {};
          this.onKeyDown = event => {
            if (['KeyW', 'KeyS', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
              event.preventDefault();
              this.keys[event.code] = true;
            }
          };
          this.onKeyUp = event => { this.keys[event.code] = false; };
          window.addEventListener('keydown', this.onKeyDown);
          window.addEventListener('keyup', this.onKeyUp);
          this.lastPosition = this.el.object3D.position.clone();
          this.outerBounds = null;
          const hallway = document.getElementById('hallway');
          if (hallway) {
            hallway.addEventListener('model-loaded', () => {
              const model = hallway.getObject3D('mesh');
              if (!model) return;
              model.updateMatrixWorld(true);
              const bounds = new THREE.Box3().setFromObject(model);
              this.outerBounds = bounds;
            });
          }
        },
        tick: function (time, delta) {
          const camera = this.el.querySelector('[camera]');
          if (!camera) return;

          const camObj = camera.object3D;
          const forward = new THREE.Vector3();
          const right = new THREE.Vector3();
          const up = new THREE.Vector3(0, 1, 0);

          camObj.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();
          right.crossVectors(forward, up).normalize();

          const moveForward = (this.keys.KeyS || this.keys.ArrowDown ? 1 : 0) - (this.keys.KeyW || this.keys.ArrowUp ? 1 : 0);
          const moveRight = (this.keys.KeyD || this.keys.ArrowRight ? 1 : 0) - (this.keys.KeyA || this.keys.ArrowLeft ? 1 : 0);

          let speedScale = 1;
          if (this.outerBounds) {
            const y = this.el.object3D.position.y;
            const minY = -9;
            const maxY = 1;
            const range = maxY - minY || 1;
            const t = THREE.MathUtils.clamp((y - minY) / range, 0, 1);
            speedScale = 0.5 + t * 1.5;
          }

          const speed = this.data.speed * speedScale * delta / 1000;
          const offset = new THREE.Vector3();
          offset.copy(forward).multiplyScalar(moveForward * speed);
          offset.addScaledVector(right, moveRight * speed);

          const next = this.el.object3D.position.clone().add(offset);
          if (!this.outerBounds) {
            this.el.object3D.position.copy(next);
            return;
          }

          const radius = 0.5;
          const minX = this.outerBounds.min.x + radius;
          const maxX = this.outerBounds.max.x - radius;
          const minY = this.outerBounds.min.y + radius;
          const maxY = this.outerBounds.max.y - radius;
          const minZ = this.outerBounds.min.z + radius;
          const maxZ = this.outerBounds.max.z - radius;

          if (next.x < minX || next.x > maxX) return;
          if (next.y < minY || next.y > maxY) return;
          if (next.z < minZ || next.z > maxZ) return;

          this.el.object3D.position.copy(next);
        },
        remove: function () {
          window.removeEventListener('keydown', this.onKeyDown);
          window.removeEventListener('keyup', this.onKeyUp);
        }
      });
    </script>
  </head>
  <body>
    <!-- Main A-Frame scene container. -->
    <a-scene>
      <!-- Assets loaded into the scene, including the hallway/building model. -->
      <a-assets>
        <a-asset-item id="tree" src="gaetanProject2.glb"></a-asset-item>
      </a-assets>

      <!-- A single point light for basic scene illumination. -->
      <a-light type="point" color="#ffffff" intensity="2.2" distance="18" position="-0.15 -0.86 -6.50"></a-light>

      <!-- The imported 3D hallway mesh that acts as the collision and visual boundary. -->
      <a-entity id="hallway" gltf-model="#tree"></a-entity>

      <!-- Player rig: movement is applied to this entity, while the camera is a child for first-person look controls. -->
      <a-entity id="player" position="0 -2.12 -3.79" camera-relative-controls="speed: 0.7" vertical-controls="speed: 0.9">
        <a-entity camera position="0 0 0" look-controls>
          <!-- Flashlight-like light attached to the camera. -->
          <a-light type="spot" color="#fff5db" intensity="3.2" angle="26" penumbra="0.9" distance="16" position="0 0 0" rotation="0 0 0"></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <div id="start-menu">
      <div class="menu-card">
        <p class="intro">It's late, did you finish your project yet? Why don't you go for a little walk...</p>

        <div class="options">
          <button id="start-button" class="option-button primary" type="button">OK</button>
          <button id="howto-button" class="option-button" type="button">How to</button>
        </div>

        <div id="howto-panel" class="tab-panel">
          <p><strong>Move around:</strong> use <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or the arrow keys to walk forward, back, left, and right.</p>
          <p><strong>Move up and down:</strong> use <kbd>R</kbd> to go up and <kbd>F</kbd> to go down.</p>
        </div>
      </div>
    </div>

    <script>
      const startMenu = document.getElementById('start-menu');
      const startButton = document.getElementById('start-button');
      const howToButton = document.getElementById('howto-button');
      const howToPanel = document.getElementById('howto-panel');

      function hideStartMenu() {
        if (startMenu) {
          startMenu.classList.add('hidden');
        }
      }

      if (startButton) {
        startButton.addEventListener('click', hideStartMenu);
      }

      if (howToButton) {
        howToButton.addEventListener('click', () => {
          if (howToPanel) {
            howToPanel.classList.toggle('active');
          }
        });
      }

      window.addEventListener('keydown', (event) => {
        if (startMenu && !startMenu.classList.contains('hidden')) {
          hideStartMenu();
        }
      }, { once: true });
    </script>

</body>
</html>
