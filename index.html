<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('mesh-collision', {
        schema: {
          target: { type: 'selector' },
          radius: { default: 0.35 }
        },
        init: function () {
          this.meshBounds = [];
          this.lastSafePosition = this.el.object3D.position.clone();
          this.onModelLoaded = this.onModelLoaded.bind(this);
          this.data.target.addEventListener('model-loaded', this.onModelLoaded);
          if (this.data.target.getObject3D('mesh')) this.onModelLoaded();
        },
        onModelLoaded: function () {
          const model = this.data.target.getObject3D('mesh');
          this.meshBounds = [];
          model.updateMatrixWorld(true);
          model.traverse(object => {
            if (!object.isMesh || !object.geometry) return;
            const bounds = new THREE.Box3().setFromObject(object);
            const size = bounds.getSize(new THREE.Vector3());
            const isEnclosingShell = size.x > 12 && size.z > 25;
            if (!isEnclosingShell) this.meshBounds.push(bounds);
          });
        },
        intersectsMesh: function (position) {
          const radius = this.data.radius;
          return this.meshBounds.some(bounds =>
            position.x + radius > bounds.min.x && position.x - radius < bounds.max.x &&
            position.y + radius > bounds.min.y && position.y - radius < bounds.max.y &&
            position.z + radius > bounds.min.z && position.z - radius < bounds.max.z
          );
        },
        tick: function () {
          const position = this.el.object3D.position;
          const previous = this.lastSafePosition;

          if (this.intersectsMesh(position)) position.x = previous.x;

          if (this.intersectsMesh(position)) position.z = previous.z;

          if (this.intersectsMesh(position)) position.y = previous.y;

          this.lastSafePosition.copy(position);
        },
        remove: function () {
          this.data.target.removeEventListener('model-loaded', this.onModelLoaded);
        }
      });

      AFRAME.registerComponent('vertical-controls', {
        schema: { speed: { default: 3 } },
        init: function () {
          this.keys = {};
          this.outerBounds = null;
          this.onKeyDown = event => {
            if (['ShiftLeft', 'ShiftRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'KeyR', 'KeyF'].includes(event.code)) {
              event.preventDefault();
              this.keys[event.code] = true;
            }
          };
          this.onKeyUp = event => { this.keys[event.code] = false; };
          window.addEventListener('keydown', this.onKeyDown);
          window.addEventListener('keyup', this.onKeyUp);

          const hallway = document.getElementById('hallway');
          if (hallway) {
            hallway.addEventListener('model-loaded', () => {
              const model = hallway.getObject3D('mesh');
              if (!model) return;
              model.updateMatrixWorld(true);
              this.outerBounds = new THREE.Box3().setFromObject(model);
            });
          }
        },
        tick: function (time, delta) {
          const up = this.keys.ArrowUp || this.keys.PageUp || this.keys.KeyR;
          const down = this.keys.ShiftLeft || this.keys.ShiftRight || this.keys.ArrowDown || this.keys.PageDown || this.keys.KeyF;
          const direction = (up ? 1 : 0) - (down ? 1 : 0);
          if (!direction) return;

          const nextY = this.el.object3D.position.y + direction * this.data.speed * delta / 1000;
          if (!this.outerBounds) {
            this.el.object3D.position.y = nextY;
            return;
          }

          const radius = 0.5;
          const minY = this.outerBounds.min.y + radius;
          const maxY = this.outerBounds.max.y - radius;
          if (nextY < minY || nextY > maxY) return;

          this.el.object3D.position.y = nextY;
        },
        remove: function () {
          window.removeEventListener('keydown', this.onKeyDown);
          window.removeEventListener('keyup', this.onKeyUp);
        }
      });

      AFRAME.registerComponent('camera-relative-controls', {
        schema: { speed: { default: 3.2 } },
        init: function () {
          this.keys = {};
          this.onKeyDown = event => {
            if (['KeyW', 'KeyS', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
              event.preventDefault();
              this.keys[event.code] = true;
            }
          };
          this.onKeyUp = event => { this.keys[event.code] = false; };
          window.addEventListener('keydown', this.onKeyDown);
          window.addEventListener('keyup', this.onKeyUp);
          this.lastPosition = this.el.object3D.position.clone();
          this.outerBounds = null;
          const hallway = document.getElementById('hallway');
          if (hallway) {
            hallway.addEventListener('model-loaded', () => {
              const model = hallway.getObject3D('mesh');
              if (!model) return;
              model.updateMatrixWorld(true);
              const bounds = new THREE.Box3().setFromObject(model);
              this.outerBounds = bounds;
            });
          }
        },
        tick: function (time, delta) {
          const camera = this.el.querySelector('[camera]');
          if (!camera) return;

          const camObj = camera.object3D;
          const forward = new THREE.Vector3();
          const right = new THREE.Vector3();
          const up = new THREE.Vector3(0, 1, 0);

          camObj.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();
          right.crossVectors(forward, up).normalize();

          const moveForward = (this.keys.KeyS || this.keys.ArrowDown ? 1 : 0) - (this.keys.KeyW || this.keys.ArrowUp ? 1 : 0);
          const moveRight = (this.keys.KeyD || this.keys.ArrowRight ? 1 : 0) - (this.keys.KeyA || this.keys.ArrowLeft ? 1 : 0);

          let speedScale = 1;
          if (this.outerBounds) {
            const y = this.el.object3D.position.y;
            const minY = -9;
            const maxY = 1;
            const range = maxY - minY || 1;
            const t = THREE.MathUtils.clamp((y - minY) / range, 0, 1);
            speedScale = 0.5 + t * 1.5;
          }

          const speed = this.data.speed * speedScale * delta / 1000;
          const offset = new THREE.Vector3();
          offset.copy(forward).multiplyScalar(moveForward * speed);
          offset.addScaledVector(right, moveRight * speed);

          const next = this.el.object3D.position.clone().add(offset);
          if (!this.outerBounds) {
            this.el.object3D.position.copy(next);
            return;
          }

          const radius = 0.5;
          const minX = this.outerBounds.min.x + radius;
          const maxX = this.outerBounds.max.x - radius;
          const minY = this.outerBounds.min.y + radius;
          const maxY = this.outerBounds.max.y - radius;
          const minZ = this.outerBounds.min.z + radius;
          const maxZ = this.outerBounds.max.z - radius;

          if (next.x < minX || next.x > maxX) return;
          if (next.y < minY || next.y > maxY) return;
          if (next.z < minZ || next.z > maxZ) return;

          this.el.object3D.position.copy(next);
        },
        remove: function () {
          window.removeEventListener('keydown', this.onKeyDown);
          window.removeEventListener('keyup', this.onKeyUp);
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="tree" src="gaetanProject2.glb"></a-asset-item>
      </a-assets>

      <a-light type="point" color="#ffffff" intensity="2.2" distance="18" position="-0.15 -0.86 -6.50"></a-light>

      <a-entity id="hallway" gltf-model="#tree"></a-entity>

      <a-entity id="player" position="0 0.2 6" camera-relative-controls="speed: 0.7" vertical-controls="speed: 0.9">
        <a-entity camera position="0 0 0" look-controls>
          <a-light type="spot" color="#fff5db" intensity="3.2" angle="26" penumbra="0.9" distance="16" position="0 0 0" rotation="0 0 0"></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      if (scene) {
        scene.addEventListener('renderstart', () => {
          // no coordinate HUD active
        });
      }
    </script>

</body>
</html>
